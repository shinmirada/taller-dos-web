<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seccion 2 - Representante Legal y Contactos</title>
</head>

<body>
    <center>
        <h1>Formulario de inscripción</h1>
        <p>Fecha de hoy:
            <script>document.write(new Date().toLocaleDateString());</script>
        </p>
    </center>

    <table border="1" width="100%" cellpadding="4" cellspacing="0">

        <!-- TITULO -->
        <tr>
            <th colspan="6" align="center">2. REPRESENTANTE LEGAL Y PERSONAS CONTACTO</th>
        </tr>

        <!-- REPRESENTANTE LEGAL - solo jurídica -->
        <tbody id="seccion-rep-legal" style="display:none">
            <tr>
                <td><b>REPRESENTANTE LEGAL:</b></td>
                <td colspan="3"><input type="text" name="rep_legal" size="40"></td>
                <td><b>DOCUMENTO IDENTIDAD:</b></td>
                <td><input type="text" name="doc_identidad" size="20"></td>
            </tr>
            <tr>
                <td><b>CARGO:</b></td>
                <td colspan="3"><input type="text" name="cargo_rep" size="40"></td>
                <td><b>TELÉFONO DIRECTO:</b></td>
                <td><input type="text" name="tel_directo" size="20"></td>
            </tr>
            <tr>
                <td><b>CELULAR:</b></td>
                <td><input type="text" name="cel_rep" size="20"></td>
                <td><b>E-MAIL:</b></td>
                <td><input type="text" name="email_rep" size="20"></td>
                <td><b>FAX:</b></td>
                <td><input type="text" name="fax_rep" size="20"></td>
            </tr>
        </tbody>

        <!-- CONTACTOS - siempre visible (se muestra junto con lo demás) -->
        <tbody id="seccion-contactos" style="display:none">
            <tr>
                <td colspan="6" align="center"><b>CONTACTOS</b></td>
            </tr>
            <tr>
                <th>ÁREA</th>
                <th>NOMBRE</th>
                <th colspan="2">CARGO</th>
                <th>TELÉFONO</th>
                <th>E-MAIL</th>
            </tr>
            <tr>
                <td>COMERCIAL</td>
                <td><input type="text" name="nombre_comercial" size="20"></td>
                <td colspan="2"><input type="text" name="cargo_comercial" size="20"></td>
                <td><input type="text" name="tel_comercial" size="15"></td>
                <td><input type="text" name="email_comercial" size="20"></td>
            </tr>
            <tr>
                <td>TÉCNICA</td>
                <td><input type="text" name="nombre_tecnica" size="20"></td>
                <td colspan="2"><input type="text" name="cargo_tecnica" size="20"></td>
                <td><input type="text" name="tel_tecnica" size="15"></td>
                <td><input type="text" name="email_tecnica" size="20"></td>
            </tr>
        </tbody>

    </table>

    <script>
        var tipo = localStorage.getItem('tipo_persona');

        if (tipo === 'juridica') {
            document.getElementById('seccion-rep-legal').style.display = '';
            document.getElementById('seccion-contactos').style.display = '';
        } else if (tipo === 'natural') {
            document.getElementById('seccion-contactos').style.display = '';
        }
    </script>

    <br>
    <br>

    <button style="border: 5px solid black; background-color: #CCCCCC; padding: 10px 20px; cursor: pointer;">
        <a href="seccion_1.html" style="text-decoration: none; color: black; font-weight: bold;">
            ANTERIOR
        </a>
    </button>

    &nbsp;&nbsp;&nbsp;&nbsp;

    <button style="border: 5px solid black; background-color: #CCCCCC; padding: 10px 20px; cursor: pointer;">
        <a href="seccion_3.html" style="text-decoration: none; color: black; font-weight: bold;">
            SIGUIENTE
        </a>
    </button>


</body>

</html>
