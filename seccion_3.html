<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección 3 - Información Tributaria</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 13px; margin: 20px; }
        table { border-collapse: collapse; }
        th { background-color: #CCCCCC; font-weight: bold; }
        td, th { font-family: Arial, sans-serif; font-size: 13px; }
        input[type="text"] { font-family: Arial, sans-serif; font-size: 13px; }
        .btn { border: 3px solid black; background-color: #CCCCCC; padding: 8px 20px; cursor: pointer; font-weight: bold; font-family: Arial, sans-serif; font-size: 13px; }
        .nav { margin-top: 20px; }
    </style>
</head>
<body>
    <center>
        <h2>Formulario de inscripción</h2>
        <p>Fecha de hoy: <script>document.write(new Date().toLocaleDateString());</script></p>
    </center>

    <table border="1" width="100%" cellpadding="4" cellspacing="0">
        <tr>
            <th colspan="8" align="center">3. INFORMACIÓN TRIBUTARIA</th>
        </tr>
        <tr>
            <td><b>GRAN CONTRIBUYENTE:</b></td>
            <td>SI <input type="radio" name="gran_contrib" value="si"> &nbsp; NO <input type="radio" name="gran_contrib" value="no"></td>
            <td><b>RESPONSABLE DE IVA:</b></td>
            <td>SI <input type="radio" name="resp_iva" value="si"> &nbsp; NO <input type="radio" name="resp_iva" value="no"></td>
            <td><b>ACTIVIDAD PRINCIPAL:</b></td>
            <td><input type="text" name="act_principal_1" size="8"></td>
            <td><input type="text" name="act_principal_2" size="8"></td>
            <td><input type="text" name="act_principal_3" size="8"></td>
        </tr>
        <tr>
            <td><b>AUTORRETENEDOR:</b></td>
            <td>SI <input type="radio" name="autorreten" value="si"> &nbsp; NO <input type="radio" name="autorreten" value="no"></td>
            <td><b>DECLARANTE DE RENTA:</b></td>
            <td>SI <input type="radio" name="decl_renta" value="si"> &nbsp; NO <input type="radio" name="decl_renta" value="no"></td>
            <td><b>OTRAS:</b></td>
            <td><input type="text" name="otras_1" size="8"></td>
            <td><input type="text" name="otras_2" size="8"></td>
            <td></td>
        </tr>
    </table>

    <div class="nav">
        <a href="seccion_2.html" style="text-decoration:none;"><button class="btn">&larr; ANTERIOR</button></a>
        &nbsp;&nbsp;
        <!-- El siguiente destino depende del tipo de persona -->
        <button class="btn" onclick="irSiguiente()">SIGUIENTE &rarr;</button>
    </div>

    <script>
        function irSiguiente() {
            var tipo = localStorage.getItem('tipo_persona');
            if (tipo === 'juridica') {
                window.location.href = 'seccion_4.html';
            } else {
                window.location.href = 'seccion_5.html';
            }
        }
    </script>
</body>
</html>
